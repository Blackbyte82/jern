<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JERN">
<title>JERN — treningslogg</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#111316;
  --iron-2:#191C21;
  --iron-3:#22262C;
  --line:#2E333A;
  --chalk:#EDEAE3;
  --chalk-dim:#8B9199;
  --ok:#39FF14;
  --warn:#C8102E;
  --display:"Barlow Condensed", "Oswald", Impact, sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --nav-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--iron);color:var(--chalk);font-family:var(--body);overscroll-behavior-y:contain}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));font-size:15px;line-height:1.45}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;font-weight:700;line-height:1}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--iron);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:baseline;gap:10px}
header h1{font-size:26px}
header .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--chalk-dim);font-family:var(--display)}
header .spacer{flex:1}
.iconbtn{color:var(--chalk-dim);font-size:20px;padding:6px 8px;line-height:1}

main{padding:16px 16px 24px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* generic */
.card{background:var(--iron-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--chalk-dim)}
.small{font-size:13px}
.tiny{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-dim);font-family:var(--display)}
.btn{display:block;width:100%;padding:14px;border-radius:8px;background:var(--chalk);color:var(--iron);
  font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:#F08A99}
.btn.sm{padding:9px;font-size:14px}
.inline{display:flex;gap:8px}
.inline>*{flex:1}
input[type=text],input[type=number],input[type=color],select{width:100%;background:var(--iron-3);border:1px solid var(--line);
  border-radius:7px;padding:11px;color:var(--chalk)}
input[type=color]{height:44px;padding:4px;cursor:pointer}
label.f{display:block;margin-bottom:10px}
label.f .tiny{display:block;margin-bottom:4px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--chalk-dim)}
.empty strong{display:block;color:var(--chalk);font-family:var(--display);font-size:20px;text-transform:uppercase;margin-bottom:6px}

/* list item */
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--iron-2);border:1px solid var(--line);
  border-radius:10px;margin-bottom:10px;width:100%;text-align:left;cursor:pointer}
.item .grow{flex:1;min-width:0}
.item .name{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.item .meta{font-size:12px;color:var(--chalk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--chalk-dim);font-size:18px}

/* active session */
.ex{background:var(--iron-2);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ex-head .name{font-family:var(--display);font-size:20px;text-transform:uppercase;flex:1}
.ex-head .target{font-size:12px;color:var(--chalk-dim);font-family:var(--display);letter-spacing:.08em}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 82px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid rgba(46,51,58,.5)}
.setrow:last-child{border-bottom:none}
.setrow.done{background:rgba(237,234,227,.05)}
.setrow.done .idx{color:var(--chalk)}
.setrow.warm{opacity:.5}
.setrow.warm .idx{color:var(--warn)}
.idx{font-family:var(--display);font-size:17px;color:var(--chalk-dim);text-align:center;cursor:pointer;border-radius:5px;padding:4px 0}
.setrow input{padding:9px;text-align:center;font-family:var(--display);font-size:18px;font-weight:600}
.check{width:82px;height:42px;border-radius:7px;border:1px solid var(--line);background:var(--iron-3);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px;
  font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk);font-variant-numeric:tabular-nums}
.check.on{background:rgba(237,234,227,.12);color:var(--chalk);border-color:var(--line);font-size:19px}
.check.cd{background:var(--warn);border-color:var(--warn);color:#fff;font-size:24px}
.check.run{background:var(--chalk);color:var(--iron);border-color:var(--chalk);font-size:19px}
.restin{display:flex;align-items:center;gap:6px}
.restin input{width:58px;padding:6px;text-align:center;font-family:var(--display);font-size:16px;font-weight:600;
  background:var(--iron-3);border:1px solid var(--line);border-radius:6px;color:var(--chalk)}
.restin .tiny{white-space:nowrap}
.ex-foot{display:flex;gap:8px;padding:10px 14px}
.ex-foot button{flex:1;padding:9px;border:1px solid var(--line);border-radius:7px;font-family:var(--display);
  font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim)}
.hint{padding:4px 14px 10px;font-size:12px;color:var(--chalk-dim)}

/* PLATES — the one place colour lives */
.plates{display:flex;align-items:center;gap:3px;padding:2px 14px 10px;flex-wrap:wrap}
.plates .lbl{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-dim);margin-right:4px}
.plate{width:11px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.plate.p25{height:34px;background:#C8102E}
.plate.p20{height:32px;background:#0B5CD5}
.plate.p15{height:29px;background:#F2C200}
.plate.p10{height:25px;background:#16A34A}
.plate.p5{height:20px;background:#E8E6E1}
.plate.p2{height:16px;background:#C8102E}
.plate.p1{height:13px;background:#9AA3AD}

/* rest timer */
#rest{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:40;
  background:var(--iron-3);border-top:1px solid var(--line);padding:10px 14px;display:none;align-items:center;gap:12px}
#rest.on{display:flex}
#rest .t{font-family:var(--display);font-size:34px;font-weight:700;min-width:86px;font-variant-numeric:tabular-nums}
#rest .bar{position:absolute;left:0;top:0;height:2px;background:var(--chalk);transition:width .25s linear}
#rest button{padding:8px 12px;border:1px solid var(--line);border-radius:7px;font-family:var(--display);
  font-size:14px;text-transform:uppercase;letter-spacing:.06em}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--iron);border-top:1px solid var(--line);display:flex}
nav button{flex:1;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-top:2px solid transparent;margin-top:-1px}
nav button.on{color:var(--chalk);border-top-color:var(--chalk)}
nav .dot{font-size:17px;line-height:1}

/* chart */
.chart{width:100%;height:150px;display:block}
.chart polyline{fill:none;stroke:var(--chalk);stroke-width:2}
.chart circle{fill:var(--chalk)}
.chart line{stroke:var(--line);stroke-width:1}

.tag{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:4px;background:var(--iron-3);border:1px solid var(--line);
  color:var(--chalk-dim);font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}

/* PR-merke */
.pr{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:4px;background:var(--ok);color:#06210a;
  font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle;
  box-shadow:0 0 6px 1px var(--ok),0 0 14px 2px color-mix(in srgb,var(--ok) 60%,transparent)}

/* merker / achievements */
.badge{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--iron-2);margin-bottom:8px;opacity:.4}
.badge.on{opacity:1;border-color:var(--ok);box-shadow:0 0 10px -3px var(--ok),inset 0 0 16px -8px var(--ok)}
.badge-ic{font-family:var(--display);font-size:22px;width:26px;text-align:center;color:var(--chalk-dim);flex-shrink:0}
.badge.on .badge-ic{color:var(--ok);text-shadow:0 0 8px var(--ok)}
.badge-name{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.02em;display:block}
.badge-desc{font-size:12px;color:var(--chalk-dim);display:block;margin-top:2px}

dialog{border:1px solid var(--line);background:var(--iron-2);color:var(--chalk);border-radius:12px;
  padding:18px;width:min(92vw,420px);max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{font-size:22px;margin-bottom:14px}
.sep{height:1px;background:var(--line);margin:16px 0}
</style>
</head>
<body>

<header>
  <h1>Jern</h1><span class="sub">treningslogg</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="openSettings" aria-label="Innstillinger">⚙</button>
</header>

<main>
  <!-- TRENING -->
  <section class="view on" id="v-train"></section>
  <!-- PROGRAM -->
  <section class="view" id="v-prog"></section>
  <!-- LOGG -->
  <section class="view" id="v-log"></section>
</main>

<div id="rest">
  <div class="bar" id="restBar"></div>
  <div><div class="tiny" id="restLbl">Hvile</div><div class="t num" id="restT">0:00</div></div>
  <button data-rest="add">+15s</button>
  <button data-rest="sub">−15s</button>
  <button data-rest="skip">Hopp over</button>
</div>

<nav>
  <button class="on" data-nav="train"><span class="dot">▲</span>Trening</button>
  <button data-nav="prog"><span class="dot">▤</span>Program</button>
  <button data-nav="log"><span class="dot">◴</span>Logg</button>
</nav>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
"use strict";
/* ---------- lagring: virker både i Claude og som vanlig nettside ---------- */
const KEY="jern:state";
const Store={
  async get(){
    if(window.storage&&window.storage.get){try{const r=await window.storage.get(KEY);return r?r.value:null}catch(e){return null}}
    try{return localStorage.getItem(KEY)}catch(e){return null}
  },
  async set(v){
    if(window.storage&&window.storage.set){try{await window.storage.set(KEY,v);return}catch(e){}}
    try{localStorage.setItem(KEY,v)}catch(e){}
  }
};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ---------- start-data ---------- */
function seed(){
  const ex=(name,muscle)=>({id:uid(),name,muscle});
  const cardioEx=name=>({id:uid(),name,type:"cardio"});
  const E=[ex("Knebøy","Bein"),ex("Markløft","Rygg"),ex("Benkpress","Bryst"),ex("Stangroing","Rygg"),
    ex("Skulderpress","Skulder"),ex("Nedtrekk","Rygg"),ex("Beinpress","Bein"),ex("Rumensk markløft","Bakside"),
    ex("Dips","Bryst"),ex("Biceps curl","Arm"),ex("Triceps pushdown","Arm"),ex("Planke","Kjerne"),
    cardioEx("Sykling"),cardioEx("Gåing/jogging (tredemølle)")];
  const byName=n=>E.find(e=>e.name===n).id;
  const it=(n,sets,reps)=>({exerciseId:byName(n),sets,reps,restSec:60});
  return {
    exercises:E,
    programs:[{id:uid(),name:"Helkropp 3×",days:[
      {id:uid(),name:"Økt A",items:[it("Knebøy",3,5),it("Benkpress",3,5),it("Stangroing",3,8),it("Planke",3,45)]},
      {id:uid(),name:"Økt B",items:[it("Markløft",3,5),it("Skulderpress",3,8),it("Nedtrekk",3,10),it("Biceps curl",3,12)]},
      {id:uid(),name:"Økt C",items:[it("Beinpress",3,10),it("Rumensk markløft",3,8),it("Dips",3,8),it("Triceps pushdown",3,12)]}
    ]}],
    sessions:[], active:null, unlocked:[],
    settings:{rest:60,restEx:60,bar:20,sound:true,notify:false,accent:"#39FF14",unit:"kg",font:"barlow",fontSize:"normal"}
  };
}
const DEFAULT_SETTINGS={rest:60,restEx:60,bar:20,sound:true,notify:false,accent:"#39FF14",unit:"kg",font:"barlow",fontSize:"normal"};
const FONT_STACKS={
  barlow:'"Barlow Condensed","Oswald",Impact,sans-serif',
  oswald:'"Oswald","Barlow Condensed",Impact,sans-serif',
  impact:'Impact,"Barlow Condensed",sans-serif',
  system:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'
};
const FONT_SIZES={sm:"87.5%",normal:"100%",lg:"112.5%",xl:"125%"};
function applyTheme(){
  document.documentElement.style.setProperty("--ok",S.settings.accent);
  document.documentElement.style.setProperty("--display",FONT_STACKS[S.settings.font]||FONT_STACKS.barlow);
  document.body.style.zoom=FONT_SIZES[S.settings.fontSize]||"100%";
}
let S=seed(), tab="train", chartEx=null;

async function save(){ await Store.set(JSON.stringify(S)); }
async function load(){
  const raw=await Store.get();
  if(raw){ try{ const p=JSON.parse(raw); if(p&&p.exercises) S=Object.assign(seed(),p);}catch(e){} }
  S.settings=Object.assign({},DEFAULT_SETTINGS,S.settings||{});
  S.unlocked=S.unlocked||[];
  applyTheme();
}
const exName=id=>{const e=S.exercises.find(x=>x.id===id);return e?e.name:"Ukjent øvelse"};
const exNote=id=>{const e=S.exercises.find(x=>x.id===id);return e&&e.note?e.note:""};
const isCardio=id=>{const e=S.exercises.find(x=>x.id===id);return !!(e&&e.type==="cardio")};
const KG_PER_LB=0.45359237;
const dispW=kg=>{const v=S.settings.unit==="lb"?(+kg||0)/KG_PER_LB:(+kg||0);return Math.round(v*100)/100};
const storeW=v=>{v=+v||0;return S.settings.unit==="lb"?v*KG_PER_LB:v};
const unitLbl=()=>S.settings.unit==="lb"?"lb":"kg";

/* ---------- vektskiver ---------- */
const PLATES=[[25,"p25"],[20,"p20"],[15,"p15"],[10,"p10"],[5,"p5"],[2.5,"p2"],[1.25,"p1"]];
function plateHTML(total){
  const bar=S.settings.bar;
  if(!total||total<=bar) return "";
  let side=(total-bar)/2, out="";
  for(const [w,c] of PLATES){ while(side>=w-0.001){ out+=`<span class="plate ${c}" title="${w} kg"></span>`; side-=w; } }
  if(!out||side>0.01) return "";
  return `<div class="plates"><span class="lbl">per side</span>${out}</div>`;
}

/* ---------- økt ---------- */
function startSession(prog,day){
  S.active={id:uid(),name:day?day.name:"Fri økt",programId:prog?prog.id:null,startedAt:Date.now(),
    entries:(day?day.items:[]).map(i=>({exerciseId:i.exerciseId,restSec:i.restSec||S.settings.rest,
      sets: isCardio(i.exerciseId)
        ? Array.from({length:i.sets||1},()=>({distanceKm:"",durationMin:"",done:false}))
        : Array.from({length:i.sets},()=>({weight:lastWeight(i.exerciseId),reps:i.reps,done:false}))}))};
  save(); go("train");
}
function lastWeight(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const e=S.sessions[i].entries.find(x=>x.exerciseId===exId);
    if(e){const d=e.sets.filter(s=>s.done&&!s.warmup);if(d.length)return d[d.length-1].weight;}
  }
  return "";
}
function suggestedWeight(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const e=S.sessions[i].entries.find(x=>x.exerciseId===exId);
    if(e){
      const work=e.sets.filter(s=>!s.warmup&&(+s.weight||0)>0);
      if(work.length){
        const top=work.reduce((m,s)=>((+s.weight)>(+m.weight)?s:m),work[0]);
        const inc=S.settings.unit==="lb"?5*KG_PER_LB:2.5;
        return +top.weight+inc;
      }
    }
  }
  return null;
}
function finishSession(){
  const a=S.active; if(!a) return;
  a.entries.forEach(e=>e.sets=e.sets.filter(s=>s.done));
  a.entries=a.entries.filter(e=>e.sets.length);
  a.endedAt=Date.now();
  const hadEntries=a.entries.length;
  if(hadEntries) S.sessions.push(a);
  S.active=null; cd=null; running=null; stopRest();
  if(hadEntries) showFinishSummary(a);
  save(); render();
}
function volume(s){return s.entries.reduce((t,e)=>t+e.sets.reduce((v,x)=>v+(x.warmup?0:(+x.weight||0)*(+x.reps||0)),0),0)}
function allTimeBest(exId){
  let best=0;
  S.sessions.forEach(s=>{
    const e=s.entries.find(x=>x.exerciseId===exId);
    if(e) e.sets.forEach(st=>{ if(st.warmup) return; const w=+st.weight||0; if(w>best) best=w; });
  });
  return best;
}

/* ---------- merker ---------- */
function tierAchievements(idPrefix,cat,names,descFn,icon,statKey,thresholds){
  return thresholds.map((t,i)=>({id:idPrefix+i,cat,name:names[i],desc:descFn(t),icon,check:st=>st[statKey]>=t}));
}
const ACHIEVEMENTS=[
  ...tierAchievements("sesh","Økter",
    ["Første stål","Smigranitt","På skinner","Jernvilje","Fjellet","Steinhard","Uutslitelig","Uslåelig","Legende","Helt år"],
    t=>`Fullfør ${t} økt${t===1?"":"er"}`,"①","sessions",[1,5,10,25,50,75,100,150,200,365]),
  ...tierAchievements("vol","Volum",
    ["Første tonn","Tonnasje","Stålverk","Jernbane","Smelteverk","Malmfjell","Gruvedrift","Meteorregn","Én million","To millioner"],
    t=>`Løft ${t.toLocaleString("nb-NO")} kg totalt`,"▲","volume",[1000,5000,10000,25000,50000,100000,250000,500000,1000000,2000000]),
  ...tierAchievements("pr","Rekorder",
    ["Ny rekord","Rekordbryter","Rekordjeger","Umettelig","Rekordmaskin","Serieoppdaterer","Kronisk forbedring","Grenseløs","Rekordfabrikk","Uovertruffen"],
    t=>`Sett ${t} personlige rekord${t===1?"":"er"}`,"★","prs",[1,3,5,10,15,25,40,60,90,130]),
  ...tierAchievements("var","Variasjon",
    ["Nybegynner","Allsidig","Mangfoldig","Fullstack","Spesialist","Ekspert","Encyklopedi","Øvelsesmester","Vandrende leksikon","Altetende"],
    t=>`Logg ${t} forskjellige øvelser`,"◆","exVariety",[3,5,8,10,15,20,25,30,40,50]),
  ...tierAchievements("big","Enkeltøkt",
    ["God innsats","Solid","Rått","Beinhardt","Uutholdelig","Marathon","Krigsmaskin","Uslukkelig","Enmannshær","Legendarisk"],
    t=>`Fullfør ${t} sett i én økt`,"■","maxSetsInSession",[10,15,20,25,30,40,50,60,80,100]),
  ...tierAchievements("week","Konsistens",
    ["Rutine","Vane","Fast innslag","Ukemester","Sesongform","Halvår","Helår i gang","Ett år","Halvannet år","To år"],
    t=>`${t} uker på rad med minst én økt`,"▣","weekStreak",[2,4,8,12,20,30,40,52,78,104]),
  ...tierAchievements("max","Tyngste løft",
    ["Tunge tak","Solid singel","Trippel siffer","Stålnever","Jernhånd","Bøyd men ikke brutt","Massiv","Enorm","Grensesprengende","Overmenneskelig"],
    t=>`Løft ${t} kg i ett sett`,"●","maxSingleSet",[60,80,100,120,140,160,180,200,250,300]),
  ...tierAchievements("tot","Totalt sett",
    ["Oppvarming","Går seg til","Rutinert","Sett-samler","Settmaskin","Repetisjonskonge","Settlegende","Ti tusen sett"],
    t=>`Fullfør ${t.toLocaleString("nb-NO")} sett totalt`,"▮","totalSets",[50,100,250,500,1000,2000,5000,10000]),
  ...tierAchievements("cardio","Kondisjon",
    ["Første kilometer","Oppvarmet","Turgåer","Syklist","Ultraløper","Langtur","Verdensomseiler"],
    t=>`Logg ${t} km oppvarming/kondisjon totalt`,"◐","totalCardioKm",[5,25,50,100,250,500,1000])
];
function weekStart(ts){
  const d=new Date(ts); const day=(d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-day);
  return d.getTime();
}
function computeWeekStreak(){
  const weeks=[...new Set(S.sessions.map(s=>weekStart(s.startedAt)))].sort((a,b)=>a-b);
  if(!weeks.length) return 0;
  let best=1,cur=1;
  for(let i=1;i<weeks.length;i++){
    const diff=Math.round((weeks[i]-weeks[i-1])/(7*86400000));
    cur=diff===1?cur+1:1;
    if(cur>best) best=cur;
  }
  return best;
}
function achievementStats(){
  let volume=0, prs=0, maxSetsInSession=0, totalSets=0, maxSingleSet=0, totalCardioKm=0; const exSet=new Set();
  S.sessions.forEach(s=>{
    let setsInSession=0;
    s.entries.forEach(e=>{
      if(isCardio(e.exerciseId)){
        e.sets.forEach(st=>{ totalCardioKm+=(+st.distanceKm||0); });
        return;
      }
      exSet.add(e.exerciseId);
      e.sets.forEach(st=>{
        if(st.warmup) return;
        const w=+st.weight||0;
        volume+=w*(+st.reps||0);
        setsInSession++; totalSets++;
        if(w>maxSingleSet) maxSingleSet=w;
        if(st.isPR) prs++;
      });
    });
    if(setsInSession>maxSetsInSession) maxSetsInSession=setsInSession;
  });
  return {sessions:S.sessions.length, volume, prs, exVariety:exSet.size, maxSetsInSession, totalSets, maxSingleSet, weekStreak:computeWeekStreak(), totalCardioKm};
}
function checkNewAchievements(){
  const st=achievementStats();
  const newly=ACHIEVEMENTS.filter(a=>a.check(st)&&!S.unlocked.includes(a.id));
  newly.forEach(a=>S.unlocked.push(a.id));
  return newly;
}
function achievementsHTML(){
  const st=achievementStats();

    }).join("");

  }).join("");
  return `<div class="card"><div class="tiny" style="margin-bottom:4px">Merker (${unlockedCount}/${ACHIEVEMENTS.length})</div>${body}</div>`;
}

/* ---------- hviletimer ---------- */
let restEnd=0,restTotal=0,restOn=false,AC=null;
let cd=null;      // nedtelling før sett: {ei,si,end,last}
let running=null; // sett som pågår: {ei,si,start}

function beep(freq,dur,vol){
  if(!S.settings.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.frequency.value=freq;o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function unlockAudio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume(); }catch(e){} }

function startCountdown(ei,si){
  stopRest(); running=null;
  unlockAudio();
  cd={ei,si,end:Date.now()+5000,last:6};
  render();
}
function startRest(sec,label){
  restTotal=Math.max(1,sec); restEnd=Date.now()+restTotal*1000; restOn=true;
  $("#restLbl").textContent=label||"Hvile";
  $("#rest").classList.add("on"); paintRest();
}
function stopRest(){ restOn=false; $("#rest").classList.remove("on"); }
function paintRest(){
  const left=Math.max(0,Math.round((restEnd-Date.now())/1000));
  $("#restT").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("#restBar").style.width=(restTotal?Math.max(0,left/restTotal*100):0)+"%";
  return left;
}
function btnEl(ei,si){ return document.querySelector(`[data-btn="${ei}-${si}"]`); }

setInterval(()=>{
  if(cd){
    const left=Math.ceil((cd.end-Date.now())/1000);
    if(left<cd.last){ cd.last=left; if(left>0) beep(760,0.12); }
    const el=btnEl(cd.ei,cd.si); if(el) el.textContent=left>0?left:"KJØR";
    if(left<=0){
      beep(1180,0.4,0.3);
      if(navigator.vibrate) navigator.vibrate(120);
      running={ei:cd.ei,si:cd.si,start:Date.now()}; cd=null; render();
    }
  }
  if(running){
    const el=btnEl(running.ei,running.si);
    if(el){ const s=Math.floor((Date.now()-running.start)/1000);
      el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  }
  if(restOn && paintRest()<=0){
    stopRest();
    if(navigator.vibrate) navigator.vibrate([220,110,220]);
    beep(880,0.25); setTimeout(()=>beep(880,0.25),300);
    if(S.settings.notify&&typeof Notification!=="undefined"&&Notification.permission==="granted"&&navigator.serviceWorker){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification("Hvilen er over!",{body:"Klar for neste sett.",tag:"jern-rest",renotify:true,vibrate:[220,110,220]}));
    }
  }
},200);

function chartHTML(exId){
  const pts=[];
  S.sessions.forEach(s=>{
    const e=s.entries.find(x=>x.exerciseId===exId); if(!e) return;
    const top=e.sets.reduce((m,x)=>Math.max(m,x.warmup?0:(+x.weight||0)),0);
    if(top>0) pts.push({t:s.startedAt,v:top});
  });
  if(pts.length<2) return `<div class="small muted" style="padding:16px 0">Trenger minst to økter med denne øvelsen for å tegne graf.</div>`;
  const W=320,H=150,P=22;
  const min=Math.min(...pts.map(p=>p.v)), max=Math.max(...pts.map(p=>p.v)), span=(max-min)||1;
  const X=i=>P+i*(W-P*2)/(pts.length-1);
  const Y=v=>H-P-((v-min)/span)*(H-P*2);
  const poly=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Progresjon">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}"/>
    <polyline points="${poly}"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3"/>`).join("")}
    <text x="${P}" y="14" fill="#8B9199" font-size="11" font-family="sans-serif">${dispW(max)} ${unitLbl()}</text>
    <text x="${P}" y="${H-6}" fill="#8B9199" font-size="11" font-family="sans-serif">${dispW(min)} ${unitLbl()}</text>
  </svg>`;
}

    <label class="f"><span class="tiny">Navn</span><input type="text" id="nx-name" placeholder="F.eks. Frontbøy"></label>
    <label class="f"><span class="tiny">Type</span>
      <select id="nx-type"><option value="strength">Styrke (vekt × reps)</option><option value="cardio">Kondisjon (km / min)</option></select></label>
    <label class="f"><span class="tiny">Muskelgruppe</span><input type="text" id="nx-m" placeholder="Bein"></label>
    <label class="f"><span class="tiny">Notat (grep, teknikk o.l.)</span><input type="text" id="nx-note" placeholder="F.eks. bredt grep"></label>
    <div class="inline"><button class="btn ghost sm" data-act="close">Avbryt</button>
    <button class="btn sm" data-act="saveex">Lagre</button></div>`);
}
function dlgEditExercise(ex){
  dlg(`<h2>${esc(ex.name)}</h2>
    <label class="f"><span class="tiny">Navn</span><input type="text" id="ex-name" value="${esc(ex.name)}"></label>
    <label class="f"><span class="tiny">Type</span>
      <select id="ex-type">
        <option value="strength" ${ex.type!=="cardio"?"selected":""}>Styrke (vekt × reps)</option>
        <option value="cardio" ${ex.type==="cardio"?"selected":""}>Kondisjon (km / min)</option>
      </select></label>
    <label class="f"><span class="tiny">Muskelgruppe</span><input type="text" id="ex-m" value="${esc(ex.muscle||"")}"></label>
    <label class="f"><span class="tiny">Notat (grep, teknikk o.l.)</span><input type="text" id="ex-note" value="${esc(ex.note||"")}" placeholder="F.eks. bredt grep"></label>
    <div class="inline"><button class="btn danger sm" data-act="delex" data-id="${ex.id}">Slett øvelse</button>
    <button class="btn sm" data-act="saveexedit" data-id="${ex.id}">Lagre</button></div>`);
}
function dlgEditDay(p,d){
  dlg(`<h2>${esc(d.name)}</h2>
    <label class="f"><span class="tiny">Navn på økt</span><input type="text" id="dy-name" value="${esc(d.name)}"></label>
    <div class="tiny" style="margin-bottom:8px">Øvelser</div>
    ${d.items.length?d.items.map((i,ix)=>`<div class="setrow" style="grid-template-columns:1fr 52px 52px 34px;padding:6px 0">
        <span class="small">${esc(exName(i.exerciseId))}${isCardio(i.exerciseId)?' <span class="tag">Kondisjon</span>':""}</span>
        <input type="number" value="${i.sets}" data-di="${ix}" data-df="sets" aria-label="Sett">
        <input type="number" value="${i.reps}" data-di="${ix}" data-df="reps" aria-label="Reps">
        <button class="iconbtn" data-act="rmitem" data-di="${ix}">✕</button></div>`).join(""):`<div class="small muted">Ingen øvelser ennå.</div>`}
    <div class="sep"></div>
    <label class="f"><span class="tiny">Legg til øvelse</span>
      <select id="dy-add"><option value="">Velg …</option>${S.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select></label>
    <button class="btn ghost sm" data-act="additem" style="margin-bottom:12px">Legg til</button>
    <div class="inline"><button class="btn danger sm" data-act="delday">Slett økt</button>
    <button class="btn sm" data-act="saveday">Ferdig</button></div>`);
  $("#dlg").dataset.p=p.id; $("#dlg").dataset.d=d.id;
}
function dlgEditSession(s){
  if(!s) return;
  dlg(`<h2>${esc(s.name)}</h2>
    <div class="tiny" style="margin-bottom:12px">${new Date(s.startedAt).toLocaleDateString("nb-NO",{weekday:"short",day:"numeric",month:"short"})}</div>
    ${s.entries.map((e,ei)=>{
      const cardio=isCardio(e.exerciseId);
      const rows=e.sets.map((st,si)=>cardio?`<div class="setrow" style="grid-template-columns:24px 1fr 1fr 34px;padding:6px 0">
        <span class="idx">${si+1}</span>
        <input type="number" step="0.1" value="${st.distanceKm===""?"":st.distanceKm}" data-se-e="${ei}" data-se-s="${si}" data-se-f="distanceKm" aria-label="Km">
        <input type="number" value="${st.durationMin===""?"":st.durationMin}" data-se-e="${ei}" data-se-s="${si}" data-se-f="durationMin" aria-label="Min">
        <button class="iconbtn" data-act="rmsetedit" data-se-e="${ei}" data-se-s="${si}">✕</button>
      </div>`:`<div class="setrow" style="grid-template-columns:24px 1fr 1fr 34px;padding:6px 0">
        <span class="idx">${si+1}</span>
        <input type="number" step="1.25" value="${st.weight===""?"":dispW(st.weight)}" data-se-e="${ei}" data-se-s="${si}" data-se-f="weight" aria-label="Vekt">
        <input type="number" value="${st.reps===""?"":st.reps}" data-se-e="${ei}" data-se-s="${si}" data-se-f="reps" aria-label="Reps">
        <button class="iconbtn" data-act="rmsetedit" data-se-e="${ei}" data-se-s="${si}">✕</button>
      </div>`).join("");
      return `<div class="tiny" style="margin:14px 0 6px">${esc(exName(e.exerciseId))}</div>${rows}`;
    }).join("")}
    <div class="inline" style="margin-top:14px"><button class="btn danger sm" data-act="delsession" data-id="${s.id}">Slett økt</button>
    <button class="btn sm" data-act="close">Ferdig</button></div>`);
  $("#dlg").dataset.sid=s.id;
}
function dlgPickEx(){
  dlg(`<h2>Legg til øvelse</h2>
    <label class="f"><select id="pk"><option value="">Velg …</option>
      ${S.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select></label>
    <div class="inline"><button class="btn ghost sm" data-act="close">Avbryt</button>
    <button class="btn sm" data-act="pickex">Legg til</button></div>`);
}

  const s=S.settings;
  dlg(`<h2>Innstillinger</h2>
    <label class="f"><span class="tiny">Standard hvile mellom sett (sekunder)</span><input type="number" id="st-rest" step="15" value="${s.rest}"></label>
    <label class="f"><span class="tiny">Hvile mellom øvelser (sekunder)</span><input type="number" id="st-restex" step="15" value="${s.restEx}"></label>
    <label class="f"><span class="tiny">Stangvekt (kg)</span><input type="number" id="st-bar" step="0.5" value="${s.bar}"></label>
    <label class="f row" style="gap:10px"><input type="checkbox" id="st-snd" ${s.sound?"checked":""} style="width:auto"><span class="small">Lyd når hvilen er ferdig</span></label>
    <label class="f row" style="gap:10px"><input type="checkbox" id="st-notify" ${s.notify?"checked":""} style="width:auto"><span class="small">Systemvarsel når hvilen er ferdig</span></label>
    <div class="small muted" style="margin:-6px 0 12px">Krever tillatelse fra nettleseren. Fungerer best mens appen er åpen i bakgrunnen — ikke garantert med låst skjerm lenge.</div>
    <label class="f"><span class="tiny">Aksentfarge</span><input type="color" id="st-accent" value="${s.accent}"></label>
    <label class="f"><span class="tiny">Enhet for vekt</span>
      <select id="st-unit"><option value="kg" ${s.unit!=="lb"?"selected":""}>Kilo (kg)</option><option value="lb" ${s.unit==="lb"?"selected":""}>Pund (lb)</option></select></label>
    <label class="f"><span class="tiny">Font</span>
      <select id="st-font">
        <option value="barlow" ${s.font==="barlow"?"selected":""}>Barlow Condensed (standard)</option>
        <option value="oswald" ${s.font==="oswald"?"selected":""}>Oswald</option>
        <option value="impact" ${s.font==="impact"?"selected":""}>Impact</option>
        <option value="system" ${s.font==="system"?"selected":""}>Systemfont</option>
      </select></label>
    <label class="f"><span class="tiny">Skriftstørrelse</span>
      <select id="st-fontsize">
        <option value="sm" ${s.fontSize==="sm"?"selected":""}>Liten</option>
        <option value="normal" ${s.fontSize==="normal"?"selected":""}>Normal</option>
        <option value="lg" ${s.fontSize==="lg"?"selected":""}>Stor</option>

    <button class="btn sm" data-act="savesettings">Lagre</button></div>`);

/* ---------- hendelser ---------- */
document.addEventListener("click",async ev=>{
  const nav=ev.target.closest("[data-nav]");
  if(nav){ go(nav.dataset.nav); return; }
  const r=ev.target.closest("[data-rest]");
  if(r){
    const k=r.dataset.rest;
    if(k==="skip") stopRest();
    else { restEnd+=(k==="add"?15000:-15000); restTotal+=(k==="add"?15:-15); paintRest(); }
    return;
  }
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;

  if(a==="start"){
    const p=S.programs.find(x=>x.id===b.dataset.p);
    startSession(p,p.days.find(x=>x.id===b.dataset.d)); return;
  }
  if(a==="freeStart"){ startSession(null,null); render(); return; }
  if(a==="startset"){ startCountdown(+b.dataset.e,+b.dataset.s); return; }
  if(a==="cancelset"){ cd=null; render(); return; }
  if(a==="doneset"){
    const ei=+b.dataset.e, si=+b.dataset.s;
    const e=S.active.entries[ei], s=e.sets[si];
    const priorBest=allTimeBest(e.exerciseId);
    s.done=true; s.ts=Date.now();
    if(!s.warmup&&(+s.weight||0)>0&&(+s.weight||0)>priorBest) s.isPR=true;
    if(running&&running.ei===ei&&running.si===si){ s.durSec=Math.round((Date.now()-running.start)/1000); }
    running=null;
    const lastInEx=e.sets.every(x=>x.done);
    startRest(lastInEx?(S.settings.restEx||60):(e.restSec||S.settings.rest),
              lastInEx?"Hvile før neste øvelse":"Hvile mellom sett");
    await save(); render(); return;
  }
  if(a==="undoset"){
    const e=S.active.entries[+b.dataset.e], s=e.sets[+b.dataset.s];
    s.done=false; s.isPR=false; stopRest(); await save(); render(); return;
  }
  if(a==="togglewarm"){
    const s=S.active.entries[+b.dataset.e].sets[+b.dataset.s];
    s.warmup=!s.warmup; await save(); render(); return;
  }
  if(a==="startcardio"){
    running={ei:+b.dataset.e,si:+b.dataset.s,start:Date.now()}; render(); return;
  }
  if(a==="donecardio"){
    const ei=+b.dataset.e, si=+b.dataset.s;
    const s=S.active.entries[ei].sets[si];
    if(running&&running.ei===ei&&running.si===si){
      const mins=Math.round((Date.now()-running.start)/60000*10)/10;
      if(!s.durationMin) s.durationMin=mins;
    }
    s.done=true; s.ts=Date.now(); running=null;
    await save(); render(); return;
  }
  if(a==="undonecardio"){
    const s=S.active.entries[+b.dataset.e].sets[+b.dataset.s];
    s.done=false; await save(); render(); return;
  }
  if(a==="addset"){ const e=S.active.entries[+b.dataset.e];
    if(isCardio(e.exerciseId)){ const l=e.sets[e.sets.length-1]||{distanceKm:"",durationMin:""};
      e.sets.push({distanceKm:l.distanceKm,durationMin:l.durationMin,done:false});
    } else { const l=e.sets[e.sets.length-1]||{weight:"",reps:""};
      e.sets.push({weight:l.weight,reps:l.reps,done:false});
    }
    await save(); render(); return; }
  if(a==="delset"){ const e=S.active.entries[+b.dataset.e]; if(e.sets.length>1)e.sets.pop(); await save(); render(); return; }
  if(a==="rmex"){ S.active.entries.splice(+b.dataset.e,1); await save(); render(); return; }
  if(a==="addex"){ dlgPickEx(); return; }
  if(a==="pickex"){ const id=$("#pk").value; if(id){
      S.active.entries.push(isCardio(id)
        ?{exerciseId:id,restSec:S.settings.rest,sets:[{distanceKm:"",durationMin:"",done:false}]}
        :{exerciseId:id,restSec:S.settings.rest,sets:[{weight:lastWeight(id),reps:8,done:false}]});
      await save(); } closeDlg(); render(); return; }
  if(a==="finish"){ finishSession(); go("log"); return; }
  if(a==="cancel"){ if(confirm("Avbryt økta? Alt du har logget forsvinner.")){ S.active=null; cd=null; running=null; stopRest(); await save(); render(); } return; }

  if(a==="addprog"){ const n=prompt("Navn på program:"); if(n){S.programs.push({id:uid(),name:n,days:[]});await save();render();} return; }
  if(a==="delprog"){ if(confirm("Slette programmet?")){ S.programs=S.programs.filter(p=>p.id!==b.dataset.p); await save(); render(); } return; }
  if(a==="addday"){ const p=S.programs.find(x=>x.id===b.dataset.p); const n=prompt("Navn på økt:","Økt "+(p.days.length+1));
    if(n){p.days.push({id:uid(),name:n,items:[]});await save();render();} return; }
  if(a==="editday"){ const p=S.programs.find(x=>x.id===b.dataset.p); dlgEditDay(p,p.days.find(x=>x.id===b.dataset.d)); return; }
  if(a==="additem"){ const id=$("#dy-add").value; if(!id) return;
    const p=S.programs.find(x=>x.id===$("#dlg").dataset.p), d=p.days.find(x=>x.id===$("#dlg").dataset.d);
    d.items.push(isCardio(id)?{exerciseId:id,sets:1,reps:0,restSec:0}:{exerciseId:id,sets:3,reps:8,restSec:S.settings.rest});
    await save(); dlgEditDay(p,d); render(); return; }
  if(a==="rmitem"){ const p=S.programs.find(x=>x.id===$("#dlg").dataset.p), d=p.days.find(x=>x.id===$("#dlg").dataset.d);
    d.items.splice(+b.dataset.di,1); await save(); dlgEditDay(p,d); render(); return; }
  if(a==="saveday"){ const p=S.programs.find(x=>x.id===$("#dlg").dataset.p), d=p.days.find(x=>x.id===$("#dlg").dataset.d);
    const n=$("#dy-name").value.trim(); if(n) d.name=n; await save(); closeDlg(); render(); return; }
  if(a==="delday"){ if(!confirm("Slette økta fra programmet?")) return;
    const p=S.programs.find(x=>x.id===$("#dlg").dataset.p); p.days=p.days.filter(x=>x.id!==$("#dlg").dataset.d);
    await save(); closeDlg(); render(); return; }
  if(a==="newex"){ dlgNewEx(); return; }
  if(a==="saveex"){ const n=$("#nx-name").value.trim(); if(n){S.exercises.push({id:uid(),name:n,type:$("#nx-type").value,muscle:$("#nx-m").value.trim(),note:$("#nx-note").value.trim()});await save();}
    closeDlg(); render(); return; }
  if(a==="editex"){ const ex=S.exercises.find(x=>x.id===b.dataset.id); if(ex) dlgEditExercise(ex); return; }
  if(a==="saveexedit"){
    const ex=S.exercises.find(x=>x.id===b.dataset.id);
    const n=$("#ex-name").value.trim();
    if(ex&&n){ ex.name=n; ex.type=$("#ex-type").value; ex.muscle=$("#ex-m").value.trim(); ex.note=$("#ex-note").value.trim(); await save(); }
    closeDlg(); render(); return;
  }
  if(a==="delex"){
    if(confirm("Slette denne øvelsen? Den fjernes fra alle programmer den brukes i.")){
      const id=b.dataset.id;
      S.exercises=S.exercises.filter(x=>x.id!==id);
      S.programs.forEach(p=>p.days.forEach(d=>d.items=d.items.filter(i=>i.exerciseId!==id)));
      if(S.active) S.active.entries=S.active.entries.filter(e=>e.exerciseId!==id);
      await save(); closeDlg(); render();
    }
    return;
  }
  if(a==="editsession"){ dlgEditSession(S.sessions.find(x=>x.id===b.dataset.id)); return; }
  if(a==="rmsetedit"){
    const s=S.sessions.find(x=>x.id===$("#dlg").dataset.sid);
    if(s){
      const e=s.entries[+b.dataset.seE]; e.sets.splice(+b.dataset.seS,1);
      if(!e.sets.length) s.entries.splice(+b.dataset.seE,1);
      if(!s.entries.length){ S.sessions=S.sessions.filter(x=>x.id!==s.id); closeDlg(); }
      else dlgEditSession(s);
      await save();
    }
    render(); return;
  }
  if(a==="delsession"){ if(confirm("Slette denne økta fra loggen?")){ S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id); await save(); closeDlg(); render(); } return; }

  if(a==="savesettings"){ S.settings.rest=+$("#st-rest").value||60; S.settings.restEx=+$("#st-restex").value||60; S.settings.bar=+$("#st-bar").value||20;
    S.settings.sound=$("#st-snd").checked;
    S.settings.accent=$("#st-accent").value||"#39FF14";
    S.settings.unit=$("#st-unit").value;
    S.settings.font=$("#st-font").value;
    S.settings.fontSize=$("#st-fontsize").value;
    applyTheme();
    const wantNotify=$("#st-notify").checked;
    if(wantNotify&&typeof Notification!=="undefined"&&Notification.permission!=="granted"){
      const perm=await Notification.requestPermission();
      S.settings.notify=perm==="granted";
      if(perm!=="granted") alert("Du må tillate varsler i nettleseren for at dette skal virke.");
    } else {
      S.settings.notify=wantNotify&&typeof Notification!=="undefined";
    }
    await save(); closeDlg(); render(); return; }
  if(a==="resetall"){
    if(confirm("Nullstille ALT? Dette sletter alle programmer, øvelser og hele loggen din permanent.")){
      if(confirm("Helt sikker? Det er ingen vei tilbake fra dette.")){
        S=seed(); applyTheme(); await save(); closeDlg(); render();
      }
    }
    return;
  }
  if(a==="export"){ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(blob), l=document.createElement("a");
    l.href=u; l.download="jern-backup-"+new Date().toISOString().slice(0,10)+".json"; l.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000); return; }
  if(a==="importBtn"){ $("#impFile").click(); return; }
  if(a==="close"){ closeDlg(); return; }
});

document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.id==="chartSel"){ chartEx=t.value; render(); return; }
  if(t.id==="impFile"&&t.files[0]){
    const txt=await t.files[0].text();
    try{ const p=JSON.parse(txt); if(!p.exercises) throw 0; S=Object.assign(seed(),p); await save(); closeDlg(); render(); }
    catch(e){ alert("Filen ser ikke ut som en JERN-backup."); }
    return;
  }
  if(t.dataset.seE!==undefined&&t.dataset.seF){
    const s=S.sessions.find(x=>x.id===$("#dlg").dataset.sid);
    if(s){
      const set=s.entries[+t.dataset.seE].sets[+t.dataset.seS];
      if(t.value==="") set[t.dataset.seF]="";
      else set[t.dataset.seF]=t.dataset.seF==="weight"?storeW(t.value):+t.value;
    }
    await save(); return;
  }
  if(t.dataset.di!==undefined&&t.dataset.df){
    const p=S.programs.find(x=>x.id===$("#dlg").dataset.p), d=p.days.find(x=>x.id===$("#dlg").dataset.d);
    d.items[+t.dataset.di][t.dataset.df]=+t.value||1; await save(); return;
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.rex!==undefined){
    S.settings.restEx=Math.max(0,+t.value||0);
    if(restOn&&$("#restLbl").textContent.indexOf("øvelse")>-1) startRest(S.settings.restEx,"Hvile før neste øvelse");
    clearTimeout(window._sv); window._sv=setTimeout(save,400); return;
  }
  if(t.dataset.rset!==undefined&&S.active){
    const e=S.active.entries[+t.dataset.rset]; e.restSec=Math.max(0,+t.value||0);
    if(restOn&&$("#restLbl").textContent.indexOf("sett")>-1) startRest(e.restSec,"Hvile mellom sett");
    clearTimeout(window._sv); window._sv=setTimeout(save,400); return;
  }
  if(t.dataset.f&&S.active){
    const s=S.active.entries[+t.dataset.e].sets[+t.dataset.s];
    if(t.dataset.f==="weight") s.weight=t.value===""?"":storeW(t.value);
    else s[t.dataset.f]=t.value===""?"":+t.value;
    clearTimeout(window._sv); window._sv=setTimeout(save,400);
  }
  if(t.dataset.cf&&S.active){
    const s=S.active.entries[+t.dataset.e].sets[+t.dataset.s];
    s[t.dataset.cf]=t.value===""?"":+t.value;
    clearTimeout(window._sv); window._sv=setTimeout(save,400);
  }
  if(t.id==="st-accent"){ document.documentElement.style.setProperty("--ok",t.value); return; }
});
$("#openSettings").addEventListener("click",dlgSettings);
$("#dlg").addEventListener("close",()=>{ document.documentElement.style.setProperty("--ok",S.settings.accent); render(); });

/* ---------- hold skjermen våken under økt ---------- */
let wl=null;
async function wakeOn(){
  if(!("wakeLock" in navigator)||wl) return;
  try{ wl=await navigator.wakeLock.request("screen"); wl.addEventListener("release",()=>{wl=null}); }catch(e){}
}
async function wakeOff(){ if(wl){ try{await wl.release()}catch(e){} wl=null; } }
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&S.active) wakeOn();
  if(restOn) paintRest();
});

/* ---------- render ---------- */
function go(t){ tab=t; document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.nav===t)); render(); window.scrollTo(0,0); }
function render(){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("#v-"+tab).classList.add("on");
  if(tab==="train") viewTrain(); else if(tab==="prog") viewProg(); else viewLog();
  if(S.active) wakeOn(); else wakeOff();
}
load().then(()=>{ if(S.active) tab="train"; render(); });

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
